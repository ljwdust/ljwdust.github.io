<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ljwdust</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f3ed;
      --card: rgba(255, 255, 255, 0.78);
      --text: #151515;
      --muted: #5f6470;
      --accent: #5b6cff;
      --border: rgba(21, 21, 21, 0.1);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101114;
        --card: rgba(24, 26, 32, 0.78);
        --text: #f5f2eb;
        --muted: #a6adbb;
        --border: rgba(255, 255, 255, 0.12);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(91, 108, 255, 0.28), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(19, 200, 167, 0.24), transparent 30rem),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(92vw, 720px);
      padding: clamp(2rem, 8vw, 4.5rem);
      border: 1px solid var(--border);
      border-radius: 32px;
      background: var(--card);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(24px);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 6rem);
      line-height: 0.92;
      letter-spacing: -0.08em;
    }

    p {
      max-width: 34rem;
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.7;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 2.2rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: inherit;
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
      background: rgba(91, 108, 255, 0.1);
      outline: none;
    }
  </style>
</head>
<body>
  <main aria-label="个人主页">
    <p class="eyebrow">GitHub Pages</p>
    <h1>ljwdust</h1>
    <p>简洁的个人主页。记录想法、项目与正在探索的方向。</p>
    <nav class="links" aria-label="相关链接">
      <a href="https://github.com/ljwdust" rel="me">GitHub</a>
    </nav>
  </main>
</body>
</html>
